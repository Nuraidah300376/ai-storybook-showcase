# Terbitkan AI Storybook Showcase (termasuk halaman prompt/) ke GitHub Pages.
# Dijalankan secara manual: tab Actions → "Terbit ke GitHub Pages" → Run workflow.
# Prasyarat: Settings → Pages → Source = "GitHub Actions". Lihat docs/PANDUAN-GITHUB-PAGES.md.
name: Terbit ke GitHub Pages

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  bina:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run ujian
      - run: npm run build
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  terbit:
    needs: bina
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.terbit.outputs.page_url }}
    steps:
      - id: terbit
        uses: actions/deploy-pages@v4
